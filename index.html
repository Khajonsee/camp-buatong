<meta name="claude:viewport-fit-sides" content="cover">
<title>Winter STEM Camp App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<style>
  /* layout: mobile-first app shell — scrolling content area + fixed bottom nav; views swapped by JS */
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --card:#ffffff;
    --fg:#171b2e; --muted:#616a86; --line:#e3e7f1; --line-2:#d3d9e8;
    --brand:#4338ca; --brand-ink:#ffffff; --teal:#0d9488; --good:#16a34a; --warn:#d97706;
    --font-head:'Kanit',system-ui,sans-serif; --font-body:'Sarabun',system-ui,sans-serif;
    --shadow:0 6px 24px rgba(23,27,46,.10);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0e1120; --surface:#171b2c; --surface-2:#1e2336; --card:#1a1f32;
    --fg:#eceefa; --muted:#9aa2be; --line:#2a3049; --line-2:#333a56;
    --brand:#8b83f0; --brand-ink:#15172a; --teal:#2dd4bf; --good:#4ade80; --warn:#fbbf24;
    --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1120; --surface:#171b2c; --surface-2:#1e2336; --card:#1a1f32;
    --fg:#eceefa; --muted:#9aa2be; --line:#2a3049; --line-2:#333a56;
    --brand:#8b83f0; --brand-ink:#15172a; --teal:#2dd4bf; --good:#4ade80; --warn:#fbbf24;
    --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5}
  h1,h2,h3,h4,.ui{font-family:var(--font-head);font-weight:600}
  button{font-family:var(--font-head);cursor:pointer}
  .wrap{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

  /* top bar */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);
    padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:21}
  .top .logo{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#e23b3b,#e5c100 35%,#2e9e5b 60%,#2b7fe0 80%,#5b47d6);font-size:16px}
  .top .ttl{font-weight:700;font-size:1rem;line-height:1.15}
  .top .sub{font-size:.68rem;opacity:.85;font-family:var(--font-body)}
  .top .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .ghost{background:rgba(255,255,255,.16);color:var(--brand-ink);border:none;border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:600}
  .pill-group{background:rgba(255,255,255,.2);border-radius:999px;padding:4px 11px;font-size:.76rem;font-weight:700;display:flex;align-items:center;gap:6px;font-family:var(--font-body)}
  .pill-group .dot{width:10px;height:10px;border-radius:50%}

  /* content */
  main{flex:1;padding:16px max(16px,env(safe-area-inset-left,0px)) 96px}
  .eyebrow{font-family:var(--font-head);font-weight:600;color:var(--teal);font-size:.8rem;letter-spacing:.2px}
  h2.page{font-size:1.35rem;font-weight:700;margin:2px 0 3px;text-wrap:balance}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:16px}

  /* home */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:14px}
  .rainbow{height:6px;border-radius:6px;margin-bottom:16px;background:linear-gradient(90deg,#e23b3b,#e07b00,#e5c100,#2e9e5b,#2b7fe0,#5b47d6,#9b3fd1)}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
  .role{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:18px 14px;text-align:center;transition:.15s}
  .role:hover{border-color:var(--brand);transform:translateY(-2px)}
  .role .ic{font-size:30px;margin-bottom:8px}
  .role .nm{font-family:var(--font-head);font-weight:700;font-size:1.05rem}
  .role .ds{font-size:.76rem;color:var(--muted);margin-top:3px}

  /* group chips */
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gcard{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;display:flex;align-items:center;gap:12px;transition:.15s}
  .gcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .gcard .gdot{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(0,0,0,.05)}
  .gcard .gname{font-family:var(--font-head);font-weight:700;font-size:1.05rem}
  .gcard .gcount{font-size:.74rem;color:var(--muted)}

  /* mission board */
  .progress{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
  .ring{--p:0;width:46px;height:46px;border-radius:50%;flex:none;
    background:conic-gradient(var(--good) calc(var(--p)*1%), var(--surface-2) 0);display:flex;align-items:center;justify-content:center}
  .ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:.82rem}
  .mcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);
    border-radius:14px;padding:13px 14px;margin-bottom:11px;width:100%;text-align:left;color:inherit}
  .mcard:hover{box-shadow:var(--shadow)}
  .mcode{background:var(--accent);color:#fff;font-family:var(--font-head);font-weight:700;border-radius:9px;width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;font-size:.92rem}
  .mttl{font-family:var(--font-head);font-weight:600;font-size:1rem}
  .mwhen{font-size:.74rem;color:var(--muted)}
  .mstat{margin-left:auto;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;font-family:var(--font-body)}
  .st-todo{background:var(--surface-2);color:var(--muted)}
  .st-done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}

  /* mission detail */
  .back{background:none;border:none;color:var(--brand);font-weight:600;font-size:.9rem;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:5px}
  .banner{border-radius:14px;padding:16px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#000))}
  .banner .bc{font-family:var(--font-head);font-weight:700;font-size:.8rem;opacity:.9}
  .banner h3{font-size:1.25rem;margin:2px 0 6px}
  .banner p{font-size:.86rem;opacity:.95;margin:0}
  .coachbox{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:11px 13px;font-size:.84rem;font-style:italic;color:var(--muted);margin-bottom:16px}
  .coachbox b{color:var(--fg);font-style:normal;font-family:var(--font-head);font-weight:600}
  label.fl{display:block;font-family:var(--font-head);font-weight:600;font-size:.88rem;margin:14px 0 6px}
  label.fl .req{color:#e23b3b}
  textarea,input[type=text],input[type=url]{width:100%;font-family:var(--font-body);font-size:.95rem;color:var(--fg);
    background:var(--surface);border:1.5px solid var(--line-2);border-radius:11px;padding:11px 13px;resize:vertical}
  textarea{min-height:76px}
  textarea:focus,input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .uploader{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;text-align:center;background:var(--surface);color:var(--muted);font-size:.86rem}
  .uploader input{display:none}
  .uploader .pick{display:inline-block;background:var(--surface-2);border-radius:9px;padding:9px 14px;font-family:var(--font-head);font-weight:600;color:var(--fg);margin-top:4px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumb{position:relative;width:72px;height:72px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:19px;height:19px;font-size:12px;line-height:1;padding:0}
  .resize-note{font-size:.72rem;color:var(--muted);margin-top:6px}
  .submit{width:100%;background:var(--brand);color:var(--brand-ink);border:none;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;margin-top:20px}
  .submit:disabled{opacity:.5}

  /* gallery */
  .live{display:flex;align-items:center;gap:7px;font-size:.8rem;color:var(--muted);margin-bottom:12px}
  .live .blip{width:9px;height:9px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.blip{animation:none}}
  .feed{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .post{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .post .ph{aspect-ratio:4/3;background:radial-gradient(circle at 30% 30%,#2b2f55,#0a0c18);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
  .post .ph img{width:100%;height:100%;object-fit:cover}
  .post .pb{padding:9px 10px}
  .post .pmeta{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .post .gchip{font-size:.66rem;font-weight:700;color:#fff;border-radius:999px;padding:1px 8px}
  .post .mtag{font-size:.66rem;color:var(--muted);font-weight:600}
  .post .pcap{font-size:.8rem;line-height:1.35}
  .post .ptime{font-size:.66rem;color:var(--muted);margin-top:4px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 10px;font-size:.9rem}

  /* teacher */
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
  .tab{white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600}
  .tab.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}
  .stat .big{font-family:var(--font-head);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
  .stat .lb{font-size:.72rem;color:var(--muted)}
  .gprog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;display:flex;align-items:center;gap:11px}
  .gprog .bar{flex:1;height:9px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .gprog .bar i{display:block;height:100%;border-radius:999px}
  .gprog .lab{font-family:var(--font-head);font-weight:600;font-size:.86rem;min-width:62px}
  .gprog .cnt{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .podium{display:flex;gap:9px;align-items:flex-end;justify-content:center;margin:16px 0}
  .pod{flex:1;max-width:100px;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px;color:#fff;text-align:center}
  .pod .rk{font-family:var(--font-head);font-weight:700;font-size:1.3rem}
  .pod .nm{font-size:.76rem;font-weight:600}
  .selrow{display:flex;gap:8px;align-items:center;margin-bottom:9px;font-size:.86rem}
  .selrow select{flex:1;font-family:var(--font-body);padding:9px 11px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--fg)}
  .award-btn{width:100%;background:linear-gradient(135deg,#f0a93b,#e07b00);color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;margin-top:6px}

  /* schedule */
  .day{margin-bottom:18px}
  .daylabel{display:inline-block;background:var(--teal);color:#fff;font-family:var(--font-head);font-weight:700;font-size:.82rem;padding:5px 12px;border-radius:999px;margin-bottom:8px}
  .srow{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .srow .st{font-family:var(--font-head);font-weight:600;color:var(--brand);font-size:.8rem;min-width:66px;flex:none;font-variant-numeric:tabular-nums}
  .srow .sa{font-size:.9rem}
  .srow .schip{display:inline-block;font-size:.66rem;font-weight:700;color:#fff;border-radius:999px;padding:1px 8px;margin-top:4px}
  .srow .splace{font-size:.74rem;color:var(--muted);margin-top:3px}

  /* accordion (teacher handbook) */
  .acc{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);overflow:hidden}
  .acc>.ah{width:100%;text-align:left;background:none;border:none;padding:13px 14px;display:flex;align-items:center;gap:10px;color:var(--fg);font-family:var(--font-head);font-weight:600;font-size:.98rem}
  .acc .anum{background:var(--brand);color:var(--brand-ink);width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:none}
  .acc .arr{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:1.1rem}
  .acc.open .arr{transform:rotate(90deg)}
  .acc .abody{display:none;padding:0 15px 15px}
  .acc.open .abody{display:block}
  .abody h4{font-family:var(--font-head);font-weight:600;color:var(--brand);font-size:.9rem;margin:13px 0 5px}
  .abody p{font-size:.88rem;margin:0 0 7px}
  .abody ul{margin:0 0 9px;padding-left:18px}
  .abody li{font-size:.86rem;margin-bottom:3px}
  .abody .mini{background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:.84rem;margin:7px 0}
  .abody .tn{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:7px 11px;border-radius:0 8px 8px 0;font-size:.82rem;margin:7px 0}
  .abody .sf{border:1px solid color-mix(in srgb,#e23b3b 40%,transparent);background:color-mix(in srgb,#e23b3b 9%,transparent);color:#c0392b;border-radius:8px;padding:7px 11px;font-size:.8rem;margin:7px 0}
  .rub{margin-bottom:8px}.rub b{font-family:var(--font-head);font-size:.86rem}.rub .lv{font-size:.78rem;color:var(--muted);margin-top:2px}

  /* gallery extras */
  .feed{align-items:start}
  .delbtn{background:none;border:none;font-size:.86rem;cursor:pointer;padding:2px 3px;opacity:.55}
  .delbtn:hover{opacity:1}
  .delc{font-size:.72rem;color:#c0392b;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .delc button{font-size:.7rem;border:none;border-radius:6px;padding:3px 9px;background:#c0392b;color:#fff;font-weight:700;font-family:var(--font-body)}
  .delc button.no{background:var(--surface-2);color:var(--muted)}
  .post .prow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
  .heart{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.72rem;color:var(--fg);font-family:var(--font-body);font-weight:600}
  .heart:active{transform:scale(.92)}
  .vlink{display:inline-block;margin-top:5px;font-size:.78rem;color:#be185d;font-weight:700;text-decoration:none}
  .ans{margin-top:6px;border-top:1px dashed var(--line);padding-top:5px}
  .aln{font-size:.72rem;color:var(--muted);margin-bottom:3px;line-height:1.35}
  .aln b{color:var(--fg);font-weight:600}
  .filterbar{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}
  .fchip{white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 11px;font-size:.76rem;font-weight:600;font-family:var(--font-body)}
  .fchip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
  .revealbanner{background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good);border-radius:11px;padding:9px 12px;font-size:.82rem;margin-bottom:12px;font-weight:600}
  .tog{width:100%;border:1.5px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;font-weight:600;margin:4px 0 16px;font-size:.88rem;text-align:left;line-height:1.4}
  .tog.on{background:color-mix(in srgb,var(--good) 14%,var(--surface));border-color:var(--good);color:var(--good)}

  /* bottom nav */
  nav.bn{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    display:flex;max-width:540px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.bn button{flex:1;background:none;border:none;color:var(--muted);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-family:var(--font-body);font-weight:600}
  nav.bn button .ni{font-size:19px}
  nav.bn button.on{color:var(--brand)}

  /* toast + banners */
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:40;
    background:#16321f;color:#dcf5e5;border-radius:12px;padding:11px 18px;font-size:.88rem;font-weight:600;
    box-shadow:0 8px 28px rgba(0,0,0,.3);opacity:0;transition:.28s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .offbar{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
    color:var(--warn);border-radius:12px;padding:10px 13px;font-size:.82rem;margin-bottom:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .offbar b{font-family:var(--font-head)}
  .offbar button{margin-left:auto;background:var(--warn);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:700}
  .demo-tag{display:inline-block;background:var(--surface-2);color:var(--muted);font-size:.66rem;border-radius:999px;padding:1px 8px;margin-left:6px;font-weight:600;vertical-align:middle}
  .note{font-size:.78rem;color:var(--muted);text-align:center;margin-top:22px;padding:0 10px}
</style>

<div class="wrap">
  <header class="top">
    <div class="logo">🏕️</div>
    <div>
      <div class="ttl">Winter STEM Camp</div>
      <div class="sub">บัวตอง–น้ำพุเจ็ดสี</div>
    </div>
    <div class="right" id="topRight"></div>
  </header>
  <main id="view"></main>
  <nav class="bn" id="nav" hidden></nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- demo data ---------- */
var GROUPS=[
  {id:'red',name:'พลาสมา',color:'#e23b3b',count:10},
  {id:'orange',name:'โฟตอน',color:'#e07b00',count:10},
  {id:'yellow',name:'ควอนตัม',color:'#e5c100',count:10},
  {id:'green',name:'โมเลกุล',color:'#2e9e5b',count:10},
  {id:'blue',name:'นิวตรอน',color:'#2b7fe0',count:9},
  {id:'indigo',name:'กาแล็กซี',color:'#5b47d6',count:9}
];
var G={}; GROUPS.forEach(function(g){G[g.id]=g;});

var MISSIONS=[
  {code:'M0',title:'ล่าคำถาม',when:'ระหว่างฟังประวัติอุทยาน',accent:'#6d4ac9',
   brief:'จับ “คำถามที่อยากรู้” ≥5 ข้อ แล้วเลือก 1 ข้อเป็น “คำถามประจำกลุ่ม” ที่จะหาคำตอบให้ได้ตลอดค่าย',
   coach:'“อะไรที่เห็นแล้วเอ๊ะ?” · “คำถามนี้เราวัด/ทดสอบได้จริงไหม?”',
   fields:[{k:'q5',t:'textarea',l:'คำถามที่อยากรู้ (≥5 ข้อ)',req:true},

 {n:'4',title:'การนำเสนอ ประเมิน และมอบรางวัล',html:
  '<h4>ลำดับช่วงถอดสะเต็ม (20:00–21:00)</h4><ul>'
  +'<li><b>20:00–20:20</b> สังเคราะห์หลักฐานตอบคำถามประจำกลุ่ม (สไลด์ Canva / คลิป / อินโฟกราฟิก AI)</li>'

  +'<li><b>20:55–21:00</b> ครูรวมคะแนนตามรูบริก → ตัดสินรางวัลที่ 1–3</li></ul>'
  +'<div class="mini" style="border-left:4px solid #e07b00">🏆 <b>มอบรางวัล:</b> คณะครูตัดสินผลงานยอดเยี่ยมอันดับ 1–3 แล้วเรียนเชิญ <b>ท่านผู้อำนวยการ</b> มอบรางวัลแก่กลุ่มที่ชนะ</div>'
  +'<div class="mini" style="border-left:4px solid #be185d">🎬 <b>คลิปวิดีโอค่าย (งานพิเศษ):</b> แต่ละกลุ่มทำคลิป ≤10 นาที เล่าการมาค่ายตั้งแต่ต้นจนจบ ส่งลิงก์ในเว็บแอปได้ถึงหลังจบค่าย — <b>ไม่เกี่ยวกับการตัดสินรางวัล</b> กลุ่มที่ส่งคลิปจะได้รับ <b>เกียรติบัตรค่าย</b> 🎓</div>'
  +'<h4>รูบริกประเมิน (เน้นกระบวนการ)</h4>'

 {n:'5',title:'วัสดุ · ปรับระดับชั้น · คลังคำถามโค้ช',html:
  '<h4>วัสดุรวม</h4>'
  +'<div class="mini"><b>กล่องชุดต่อกลุ่ม (×6):</b> มือถือกลุ่ม, แก้ว/ขวดใส 2, กระดาษขาว, ไฟฉาย, กระดาษวัด pH, เทอร์โมมิเตอร์, แว่นขยาย, เชือก/ตลับเมตร</div>'
  +'<div class="mini"><b>ส่วนกลาง:</b> น้ำส้มสายชู+หลอดหยด+ถาดหลุม (M3), เข็มทิศ, คลิปจับมือถือเข้าเลนส์กล้องดูดาว, แผนที่ดาว/แอป, ไฟฉายแสงแดง, ชุดปฐมพยาบาล, นกหวีด, เราเตอร์/ฮอตสปอตสำรอง</div>'
  +'<h4>ปรับระดับตามช่วงชั้น</h4><ul>'
  +'<li><b>M2 เจ็ดสี</b> — ม.ต้น: สีมาจากแสง/สภาพแวดล้อม · ม.ปลาย: การกระเจิง/หักเหเชิงลึก + เชื่อม pH–หินปูน</li>'
  +'<li><b>M3 หินไม่ลื่น</b> — ม.ต้น: รู้ว่าเป็น CO₂ · ม.ปลาย: เขียนสมการ CaCO₃ + กรด</li>'
  +'<li><b>M4 ดาว</b> — ม.ต้น: ถ่ายภาพ + ประมาณมุมด้วยกำปั้น · ม.ปลาย: คำนวณระยะเชิงมุม/มาตราส่วนด้วยตรีโกณ</li></ul>'
  +'<h4>คลังคำถามโค้ช (ใช้แทนการบอกคำตอบ)</h4><ul>'
  +'<li>“ทำไมถึงคิดแบบนั้น? มีอะไรเป็นหลักฐาน?”</li>'
  +'<li>“ถ้าลองเปลี่ยน ___ จะเกิดอะไรขึ้น?”</li>'

/* client-side image resize → jpeg dataURL (real "ย่อรูปอัตโนมัติ") */
function resizeImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1000,w=img.width,h=img.height;
      if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>max){w=Math.round(w*max/h);h=max;}
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      try{cb(c.toDataURL('image/jpeg',0.8));}catch(e){cb(fr.result);}
    };
    img.onerror=function(){cb(fr.result);};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

  return '<button class="delbtn" title="ลบผลงาน" onclick="askDelete('+idArg(s.id)+')">🗑️</button>';
}
function askDelete(id){ state.confirmDel=id; render(); }
function cancelDel(){ state.confirmDel=null; render(); }
function doDelete(id){
  state.confirmDel=null;
  subs=subs.filter(function(s){return String(s.id)!==String(id);});
  if(!LIVE){ seed=seed.filter(function(s){return String(s.id)!==String(id);}); persist(); }
  render(); toast('🗑️ ลบผลงานแล้ว');
  if(LIVE){ apiPost({action:'delete',id:id},function(d){ refresh(); }); }
}
function galCard(it){
  var s=it.s, g=G[s.group]||{color:'#888',name:s.group}, m=M[s.mission]||{accent:'#888'};
  var showText=(state.reveal||state.role==='teacher');
  var media;
  if(it.kind==='video') media='<div class="ph" style="background:linear-gradient(135deg,#be185d,#4a0f2e);font-size:30px">🎬</div>';
  else if(s.photo) media='<div class="ph"><img src="'+s.photo+'" alt=""></div>';
  else if(s.emoji) media='<div class="ph">'+s.emoji+'</div>';
  else media='<div class="ph" style="background:linear-gradient(135deg,'+m.accent+',#1a1a2e);font-size:28px">📝</div>';
  var b='<div class="pb"><div class="pmeta"><span class="gchip" style="background:'+g.color+'">'+esc(g.name)+'</span><span class="mtag">'+s.mission+'</span></div>'
    +'<div class="pcap">'+esc(s.cap||'')+'</div>';
  if(it.kind==='video'&&s.fields&&s.fields.vlink) b+='<a class="vlink" href="'+esc(s.fields.vlink)+'" target="_blank">▶ ดูคลิป</a>';
  if(showText&&(it.kind==='text'||it.kind==='photo')) b+=fieldLines(s);
  b+='<div class="prow"><span class="ptime">'+ago(s.t)+'</span><span style="display:flex;gap:6px;align-items:center">'+delCtrl(s)+heartBtn(s)+'</span></div></div>';
  return '<div class="post">'+media+b+'</div>';
}
function fchipRow(items,cur,fn){
  return '<div class="fchips">'+items.map(function(it){
    return '<button class="fchip'+(cur===it.v?' on':'')+'" onclick="'+fn+'(\''+it.v+'\')">'+it.l+'</button>';
  }).join('')+'</div>';
}
function setGalG(v){ state.galG=v; render(); }
function setGalM(v){ state.galM=v; render(); }
function vGallery(){
  var items=galItems();
  var h='<div class="eyebrow">ผลงานทุกกลุ่ม</div><h2 class="page">แกลเลอรีสด</h2>'
    +'<div class="live"><span class="blip"></span> อัปเดตอัตโนมัติ · '+items.length+' ผลงาน</div>';
  if(state.reveal&&state.role==='student') h+='<div class="revealbanner">🔓 ครูเปิดเผยคำตอบแล้ว — ดูวิธีคิดของทุกกลุ่มได้เลย</div>';
  // filters
  var gItems=[{v:'',l:'ทุกกลุ่ม'}].concat(GROUPS.map(function(g){return {v:g.id,l:g.name};}));
  var mItems=[{v:'',l:'ทุกภารกิจ'}].concat(MISSIONS.map(function(m){return {v:m.code,l:m.code};})).concat([{v:'VDO',l:'🎬 คลิป'}]);
  h+='<div class="filterbar">'+fchipRow(gItems,state.galG,'setGalG')+fchipRow(mItems,state.galM,'setGalM')+'</div>';
  h+='<div class="feed">';
  if(!items.length) h+='<div class="empty">ยังไม่มีผลงานในหมวดนี้ — ไปทำภารกิจแล้วอัปกันเลย!</div>';
  items.forEach(function(it){ h+=galCard(it); });
  return h+'</div>';
}

function vTeacher(){
  var tot=subs.length;
  var h='<button class="back" onclick="go(\'home\')">‹ ออก</button>'
    +'<div class="eyebrow">สำหรับครู (17 คน)</div><h2 class="page">แดชบอร์ดค่าย</h2>';
  // stats
  var photos=allPosts().length;
  h+='<div class="statrow">'
    +'<div class="stat"><div class="big">'+tot+'</div><div class="lb">งานที่ส่ง</div></div>'
    +'<div class="stat"><div class="big">'+photos+'</div><div class="lb">รูปในแกลเลอรี</div></div>'
    +'<div class="stat"><div class="big">6</div><div class="lb">กลุ่ม</div></div></div>';
  // reveal toggle
  h+='<button class="tog'+(state.reveal?' on':'')+'" onclick="toggleReveal()">'
    +(state.reveal?'🔓 เปิดเผยคำตอบให้นักเรียนแล้ว — ทุกกลุ่มเห็นวิธีคิดของกันได้ (แตะเพื่อปิด)'
      :'🔒 คำตอบข้อความเห็นเฉพาะครู · แตะเพื่อ “เปิดเผยคำตอบทั้งหมด” ให้นักเรียน (แนะนำหลังนำเสนอ M5)')+'</button>';
  // per-group progress
  h+='<h3 style="font-size:1.02rem;margin:4px 0 9px">ความคืบหน้าแต่ละกลุ่ม</h3>';
  GROUPS.forEach(function(g){
    var n=doneCount(g.id),pct=Math.round(n/MISSIONS.length*100);
    h+='<div class="gprog"><span class="lab" style="color:'+g.color+'">'+g.name+'</span>'
      +'<span class="bar"><i style="width:'+pct+'%;background:'+g.color+'"></i></span>'
      +'<span class="cnt">'+n+'/'+MISSIONS.length+'</span></div>';
  });
  // feed
  h+='<h3 style="font-size:1.02rem;margin:18px 0 9px">ผลงานล่าสุด</h3><div class="feed">';
  var posts=allPosts().slice(0,6);
  if(!posts.length) h+='<div class="empty">ยังไม่มีผลงานส่งเข้ามา</div>';
  posts.forEach(function(p){var g=G[p.group]||{color:'#888',name:p.group};
    h+='<div class="post"><div class="ph">'+(p.photo?'<img src="'+p.photo+'">':(p.emoji||'🖼️'))+'</div>'
      +'<div class="pb"><div class="pmeta"><span class="gchip" style="background:'+g.color+'">'+esc(g.name)+'</span><span class="mtag">'+p.mission+'</span></div>'
      +'<div class="pcap">'+esc(p.cap||'')+'</div></div></div>';});
  h+='</div>';
  // certificate tracker (video clip)
  h+='<h3 style="font-size:1.02rem;margin:20px 0 9px">🎓 เกียรติบัตร — ส่งคลิปวิดีโอค่าย</h3>'
    +'<div style="font-size:.8rem;color:var(--muted);margin-bottom:9px">คลิป ≤10 นาที เล่าค่ายตั้งแต่ต้นจนจบ · ส่งได้ถึงหลังจบค่าย · ไม่เกี่ยวกับการตัดสินรางวัล</div>';
  GROUPS.forEach(function(g){ var ok=hasVideo(g.id), lk=videoLink(g.id);
    h+='<div class="gprog"><span class="lab" style="color:'+g.color+'">'+g.name+'</span>'
      +(ok?'<span style="flex:1;font-size:.8rem;color:var(--good)">✓ ได้เกียรติบัตร'+(lk?' · <a href="'+esc(lk)+'" target="_blank" style="color:var(--brand)">ดูคลิป</a>':'')+'</span>'
          :'<span style="flex:1;font-size:.8rem;color:var(--muted)">ยังไม่ส่งคลิป</span>')+'</div>';
  });
  // award (จากคะแนนครู 17 คน)
  var rk=ranking();
  h+='<h3 style="font-size:1.02rem;margin:20px 0 9px">🏆 ตัดสินรางวัล (จากคะแนนครู)</h3>'
    +'<div style="background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px">'
    +'<button class="tog" onclick="go(\'score\')" style="margin:0 0 12px">✍️ ครูให้คะแนนกลุ่ม — แตะเพื่อเปิดหน้าลงคะแนน</button>';
  if(!rk.length){
    h+='<div style="font-size:.84rem;color:var(--muted)">ยังไม่มีครูให้คะแนน · กดปุ่มด้านบนให้ครูแต่ละคนลงคะแนน แล้วอันดับจะขึ้นที่นี่อัตโนมัติ</div>';
  } else {
    h+='<div style="font-size:.78rem;color:var(--muted);margin-bottom:8px">อันดับจากคะแนนเฉลี่ยของครูที่ลงคะแนนแล้ว</div>';
    rk.forEach(function(it,i){
      h+='<div class="gprog"><span class="lab" style="min-width:28px">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.')+'</span>'
        +'<span class="lab" style="flex:1;color:'+it.g.color+'">'+it.g.name+'</span>'
        +'<span class="cnt">'+it.avg.toFixed(1)+' · '+it.n+' ครู</span></div>';
    });
    h+='<button class="award-btn" onclick="announce()">🎉 ประกาศผล + เชิญ ผอ. มอบรางวัล</button><div id="podium"></div>';
  }
  h+='</div>';
  return h;
}

function offbar(){
  return '<div class="offbar">📴 <b>โหมดออฟไลน์</b> — งานจะถูกเก็บคิวไว้ ('+state.pendingShots.length+' ค้าง) ส่งเมื่อมีสัญญาณ'
    +'<button onclick="flushQueue()">ส่งคิวที่ค้าง</button></div>';
}

/* ---------- actions ---------- */
function pickRole(r){ state.role=r; if(r==='student'){ state.group?go('board'):go('group'); } else go('teacher'); }
function toggleReveal(){ state.reveal=!state.reveal; render(); toast(state.reveal?'🔓 เปิดเผยคำตอบให้นักเรียนแล้ว':'🔒 ซ่อนคำตอบไว้ให้ครูเท่านั้น'); if(LIVE){ apiPost({action:'reveal',reveal:state.reveal}); } else { persist(); } }
function setGroup(id){ state.group=id; go('board'); }
function changeGroup(){ go('group'); }
function openMission(code){ state.mission=code; go('mission'); }

function addPhoto(e){
  var files=e.target.files; if(!files)return;
  Array.prototype.forEach.call(files,function(f){
    resizeImage(f,function(url){ draft.photos.push(url); drawThumbs(); });
  });
  e.target.value='';
}
function drawThumbs(){
  var t=el('thumbs'); if(!t)return;
  t.innerHTML=draft.photos.map(function(u,i){return '<div class="thumb"><img src="'+u+'"><button type="button" onclick="rmPhoto('+i+')">×</button></div>';}).join('');
}
function rmPhoto(i){ draft.photos.splice(i,1); drawThumbs(); }

function submitMission(ev){
  ev.preventDefault();
  var m=M[state.mission], f={}, cap='';
  document.querySelectorAll('#mform [data-k]').forEach(function(inp){ f[inp.getAttribute('data-k')]=inp.value.trim(); });
  if(m.code==='M4'&&!draft.photos.length){ toast('M4 ต้องอัปรูปอย่างน้อย 1 รูป'); return false; }
  // caption for gallery
  cap=f.qmain||f.concl||f.exp||f.sum||f.hyp||Object.values(f)[0]||'';
  var photos=draft.photos.slice();
  function save(photo){
    subs.push({id:nextId++,group:state.group,mission:m.code,fields:f,cap:cap,photo:photo||null,t:Date.now()});
    persist();
  }
  var payload={action:'submit',group:state.group,mission:m.code,fields:f,cap:cap,photos:photos};
  if(!LIVE && state.offline){
    state.pendingShots.push(payload);
    toast('📴 เก็บคิวไว้แล้ว — จะส่งเมื่อออนไลน์');
    go('board'); return false;
  }
  if(LIVE){
    apiPost(payload,function(d){
      if(d&&d.ok){ toast('✅ ส่งขึ้นเว็บแล้ว!'); refresh(); }
      else { state.pendingShots.push(payload); persist(); render(); toast('📴 ส่งไม่สำเร็จ — เก็บคิวไว้ กดส่งซ้ำได้'); }
    });
    toast('⏳ กำลังส่ง...');
    go('board'); return false;
  }
  if(photos.length){ photos.forEach(function(p){save(p);}); } else { save(null); }
  toast('✅ ส่งขึ้นเว็บแล้ว! ดูในแกลเลอรีได้เลย');
  go('board'); return false;
}

function flushQueue(){
  if(!state.pendingShots.length){ toast('ไม่มีคิวค้าง'); return; }
  if(LIVE){
    var q=state.pendingShots.slice(); state.pendingShots=[]; persist(); var done=0;
    toast('⏳ กำลังส่งคิว '+q.length+' งาน...');
    q.forEach(function(p){ apiPost(p,function(d){ done++; if(!(d&&d.ok)) state.pendingShots.push(p); if(done===q.length){ persist(); refresh(); toast(state.pendingShots.length?'ยังมีงานค้าง '+state.pendingShots.length:'📤 ส่งคิวครบแล้ว'); } }); });
    return;
  }
  state.pendingShots.forEach(function(q){
    if(q.photos&&q.photos.length) q.photos.forEach(function(p){subs.push({id:nextId++,group:q.group,mission:q.mission,fields:q.fields,cap:q.cap,photo:p,t:Date.now()});});
    else subs.push({id:nextId++,group:q.group,mission:q.mission,fields:q.fields,cap:q.cap,photo:null,t:Date.now()});
  });
  var n=state.pendingShots.length; state.pendingShots=[]; persist();
  toast('📤 ส่งคิว '+n+' งานเรียบร้อย'); render();
}

/* ---------- คะแนนครู ---------- */
function scoreAgg(){
  if(LIVE) return state.scoresAgg||{};
  var a={}; scoreRows.forEach(function(r){ if(!a[r.group])a[r.group]={sum:0,n:0}; a[r.group].sum+=Number(r.score)||0; a[r.group].n++; });
  var out={}; Object.keys(a).forEach(function(g){ out[g]={avg:a[g].sum/a[g].n,n:a[g].n}; });
  return out;
}
function ranking(){
  var agg=scoreAgg(), arr=[];
  GROUPS.forEach(function(g){ var x=agg[g.id]; if(x&&x.n>0) arr.push({g:g,avg:x.avg,n:x.n}); });
  arr.sort(function(a,b){ return b.avg-a.avg || b.n-a.n; });
  return arr;
}
function scoreOpts(cur){ var h=''; for(var i=1;i<=10;i++){ h+='<option value="'+i+'"'+(String(cur)===String(i)?' selected':'')+'>'+i+'</option>'; } return h; }
function vScore(){
  var h='<button class="back" onclick="go(\'teacher\')">‹ แดชบอร์ด</button>'
    +'<div class="eyebrow">สำหรับครูผู้ตัดสิน</div><h2 class="page">ให้คะแนนกลุ่ม</h2>'
    +'<p class="lead">ให้คะแนนภาพรวมแต่ละกลุ่ม 1–10 · ระบบเฉลี่ยคะแนนจากครูทุกคนแล้วจัดอันดับอัตโนมัติ</p>'
    +'<div style="background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.82rem;margin-bottom:14px">💡 <b>เกณฑ์พิจารณา:</b> หลักฐาน&เหตุผล · กระบวนการ EDP · การทำงานเป็นทีม · ความคิดสร้างสรรค์ · การนำเสนอ</div>'
    +'<label class="fl">ชื่อครูผู้ให้คะแนน <span style="color:#e23b3b">*</span></label>'
    +'<input type="text" id="tname" value="'+esc(state.teacherName||'')+'" placeholder="เช่น ครูขจรศรี (กันลงคะแนนซ้ำ)">';
  GROUPS.forEach(function(g){
    h+='<div class="selrow" style="margin-top:11px"><span style="min-width:84px;color:'+g.color+';font-weight:700;font-family:var(--font-head)">'+g.name+'</span>'
      +'<select id="sc_'+g.id+'"><option value="">— คะแนน —</option>'+scoreOpts('')+'</select></div>';
  });
  h+='<button class="submit" onclick="submitScore()">บันทึกคะแนนของฉัน</button>'
    +'<p class="note">ถ้าครูคนเดิมลงชื่อซ้ำ ระบบจะใช้คะแนนล่าสุดแทนของเดิม</p>';
  return h;
}
function submitScore(){
  var name=(el('tname').value||'').trim();
  if(!name){ toast('ใส่ชื่อครูก่อน'); return; }
  var scores={}, any=false;
  GROUPS.forEach(function(g){ var v=el('sc_'+g.id).value; if(v){ scores[g.id]=Number(v); any=true; } });
  if(!any){ toast('ให้คะแนนอย่างน้อย 1 กลุ่ม'); return; }
  state.teacherName=name; try{ localStorage.setItem('camp_teacher',name); }catch(e){}
  if(LIVE){
    apiPost({action:'score',teacher:name,scores:scores},function(d){
      if(d&&d.ok){ toast('✅ บันทึกคะแนนแล้ว'); refresh(); go('teacher'); }
      else toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');
    });
    toast('⏳ กำลังบันทึก...'); return;
  }
  scoreRows=scoreRows.filter(function(r){ return r.teacher!==name; });
  Object.keys(scores).forEach(function(gid){ scoreRows.push({teacher:name,group:gid,score:scores[gid]}); });
  persist(); toast('✅ บันทึกคะแนนแล้ว'); go('teacher');
}
function announce(){
  var rk=ranking(); if(!rk.length){ toast('ยังไม่มีคะแนน'); return; }
  function pod(it,rank,hh,color){ if(!it)return ''; return '<div class="pod" style="height:'+hh+'px;background:linear-gradient(135deg,'+color+',color-mix(in srgb,'+color+' 60%,#000))"><div class="rk">'+rank+'</div><div class="nm">'+it.g.name+'</div></div>'; }
  el('podium').innerHTML='<div class="podium">'
    +pod(rk[1],'🥈',86,'#9aa3b5')+pod(rk[0],'🥇',112,'#f0b429')+pod(rk[2],'🥉',66,'#c77b3b')+'</div>'
    +'<p style="text-align:center;color:var(--muted);font-size:.85rem">เรียนเชิญท่านผู้อำนวยการมอบรางวัลแก่กลุ่มที่ชนะ 🎉</p>';
  toast('🏆 ประกาศผลแล้ว');
}

/* toggle offline (demo) via long-press-free button in top bar when student */
function toggleOffline(){ state.offline=!state.offline; toast(state.offline?'จำลองสัญญาณหลุด 📴':'ออนไลน์แล้ว 📶'); render(); }

function bind(){
  // add offline toggle button in top-right for student/teacher
  var tr=el('topRight');
  if(state.role && !LIVE){
    var b=document.createElement('button'); b.className='ghost'; b.textContent=state.offline?'📴':'📶';
    b.title='สลับโหมดออนไลน์/ออฟไลน์ (เดโม)'; b.onclick=toggleOffline;
    tr.appendChild(b);
  }
}

if(LIVE){ render(); refresh(); setInterval(function(){ if(['gallery','teacher','board'].indexOf(state.view)>=0) refresh(); },6000); }
else { render(); }
</script>
